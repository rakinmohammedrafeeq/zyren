# -------------------------------------------------------------------
# NOTE:
# For Local Docker Testing (Oracle):
#   → Uncomment Oracle section and comment PostgreSQL section
#
# For Render Hosting (PostgreSQL):
#   → Use PostgreSQL section below
# -------------------------------------------------------------------

spring:
  application:
    name: Zyren

  main:
    lazy-initialization: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT}
  address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

zyren:
  admin:
    email: ${ZYREN_ADMIN_EMAIL}
    password: ${ZYREN_ADMIN_PASSWORD}
  mail:
    from: ${MAIL_FROM}
    to: ${MAIL_TO}

management:
  server:
    port: ${PORT}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false