# -------------------------------------------------------------------
# NOTE:
# For Local Docker Testing (Oracle):
#   → Uncomment Oracle section and comment PostgreSQL section
#
# For Render Hosting (PostgreSQL):
#   → Use PostgreSQL section below
# -------------------------------------------------------------------

spring:
  application:
    name: Zyren

  main:
    lazy-initialization: true

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  datasource:
    url: ${SPRING_DATASOURCE_URL}

    ### Use this block when running Oracle locally with Docker ###
#    driver-class-name: oracle.jdbc.OracleDriver

    ### Use this block for Render (PostgreSQL) ###
    driver-class-name: org.postgresql.Driver

    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        ### Use this block when running Oracle locally with Docker ###
#        dialect: org.hibernate.dialect.OracleDialect

        ### Use this block for Render (PostgreSQL) ###
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

#  mail:
#    host: ${SPRING_MAIL_HOST}
#    port: ${SPRING_MAIL_PORT}
#    username: ${MAIL_USERNAME}
#    password: ${MAIL_PASSWORD}
#    properties:
#      mail:
#        smtp:
#          auth: true
#          starttls:
#            enable: true

resend:
  api:
    key: ${RESEND_API_KEY}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

gemini:
  api:
    key: ${GEMINI_API_KEY}
  vision:
    # Models that support VISION + TEXT (for image/PDF analysis)
    primary: ${GEMINI_VISION_PRIMARY:gemini-3.6-flash}
    fallback1: ${GEMINI_VISION_FALLBACK1:gemini-3.5-flash}
    fallback2: ${GEMINI_VISION_FALLBACK2:gemini-3-flash}
    fallback3: ${GEMINI_VISION_FALLBACK3:gemini-2.5-flash}
  text:
    # Models that support TEXT ONLY (for titles, summaries without media)
    primary: ${GEMINI_TEXT_PRIMARY:gemini-3.5-flash-lite}
    fallback1: ${GEMINI_TEXT_FALLBACK1:gemini-3.1-flash-lite}
    fallback2: ${GEMINI_TEXT_FALLBACK2:gemini-3.6-flash}
    fallback3: ${GEMINI_TEXT_FALLBACK3:gemini-2.5-flash-lite}

groq:
  api:
    key: ${GROQ_API_KEY}
  text:
    model: ${GROQ_TEXT_MODEL:llama-3.3-70b-versatile}
  vision:
    model: ${GROQ_VISION_MODEL:meta-llama/llama-4-maverick-17b-128e-instruct}

server:
  port: ${PORT:8080}
  address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

zyren:
  admin:
    email:
      1: ${ZYREN_ADMIN_EMAIL_1}
      2: ${ZYREN_ADMIN_EMAIL_2}
    password:
      1: ${ZYREN_ADMIN_PASSWORD_1}
      2: ${ZYREN_ADMIN_PASSWORD_2}
  mail:
#    from: ${MAIL_FROM}
    to: ${MAIL_TO}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

management:
  server:
    port: ${PORT:8080}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
