#    username: ${MAIL_USERNAME}
#    password: ${MAIL_PASSWORD}
#    properties:
#      mail:
#        smtp:
#          auth: true
#          starttls:
#            enable: true

resend:
  api:
    key: ${RESEND_API_KEY}

server:
  port: ${PORT:8080}
  address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET:z9xD5p9bJ2rQv1uLk8sA4tN3fB0yW6rE5qH7oM2cV1jG9pK0nU4xT8sF3eR6wY1lZ}
  expiration: ${JWT_EXPIRATION:86400000}

zyren:
  admin:
    email:
      1: ${ZYREN_ADMIN_EMAIL_1}
      2: ${ZYREN_ADMIN_EMAIL_2}
    password:
      1: ${ZYREN_ADMIN_PASSWORD_1}
      2: ${ZYREN_ADMIN_PASSWORD_2}
  mail:
#    from: ${MAIL_FROM}
    to: ${MAIL_TO}

management:
  server:
    port: ${PORT:8080}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false