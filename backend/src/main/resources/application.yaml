# -------------------------------------------------------------------
# NOTE:
# For Local Docker Testing (Oracle):
#   → Uncomment Oracle section and comment PostgreSQL section
#
# For Render Hosting (PostgreSQL):
#   → Use PostgreSQL section below
# -------------------------------------------------------------------

spring:
  application:
    name: Zyren

  main:
    lazy-initialization: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}

    ### Use this block when running Oracle locally with Docker ###
#    driver-class-name: oracle.jdbc.OracleDriver

    ### Use this block for Render (PostgreSQL) ###
    driver-class-name: org.postgresql.Driver

    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        ### Use this block when running Oracle locally with Docker ###
#        dialect: org.hibernate.dialect.OracleDialect

        ### Use this block for Render (PostgreSQL) ###
        dialect: org.hibernate.dialect.PostgreSQLDialect

